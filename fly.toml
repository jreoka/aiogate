# Fly.io config for aio-gate (AIOStreams + gate in one container).
# Deploy: fly deploy  (first time also: fly volumes create aiogate_data --size 3 --region ord)
# Secrets (never in this file): fly secrets set AIOSTREAMS_AUTH="admin:..." SECRET_KEY="..." MASTER_URL="http://127.0.0.1:3210/stremio/u/<alias>/manifest.json"

app = "aiogate"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DATABASE_URI = "sqlite://./data/db.sqlite"
  BASE_URL = "https://stream.dill.moe"
  DATA_FILE = "/app/data/keys.json"
  AIOSTREAMS_INTERNAL_URL = "http://127.0.0.1:3210"
  AIOSTREAMS_INTERNAL_PORT = "3210"
  MAX_ADDONS = "50"
  TRUST_PROXY = "1"
  # Two Node processes share this machine (AIOStreams on :3210, the gate on
  # :3000), so cap each one's heap well under the cgroup limit. Left uncapped,
  # V8 sizes the old space against host RAM rather than the container's 1GB,
  # and a background dataset rebuild (anime-database) pushed the process into
  # the kernel's OOM range on 2026-09-29 -- the container was SIGKILLed and
  # the app was down ~2h. 384MB per process leaves comfortable headroom.
  NODE_OPTIONS = "--max-old-space-size=384"

# One persistent volume holds everything: AIOStreams' db.sqlite + the gate's keys.json.
[mounts]
  source = "aiogate_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # friends' Stremio clients hit this on demand; keep warm
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"          # skips the BASE_URL host lock, like the Docker healthcheck
    protocol = "http"
    timeout = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024   # 512MB OOM-killed the container on 2026-09-29; ~$5.70/mo
