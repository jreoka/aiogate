# Fly.io config for aio-gate (AIOStreams + gate in one container).
# Deploy: fly deploy  (first time also: fly volumes create aiogate_data --size 3 --region ord)
# Secrets (never in this file): fly secrets set AIOSTREAMS_AUTH="admin:..." SECRET_KEY="..." MASTER_URL="http://127.0.0.1:3210/stremio/u/<alias>/manifest.json"

app = "aiogate"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DATABASE_URI = "sqlite://./data/db.sqlite"
  BASE_URL = "https://stream.dill.moe"
  DATA_FILE = "/app/data/keys.json"
  AIOSTREAMS_INTERNAL_URL = "http://127.0.0.1:3210"
  AIOSTREAMS_INTERNAL_PORT = "3210"
  TRUST_PROXY = "1"

# One persistent volume holds everything: AIOStreams' db.sqlite + the gate's keys.json.
[mounts]
  source = "aiogate_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # friends' Stremio clients hit this on demand; keep warm
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"          # skips the BASE_URL host lock, like the Docker healthcheck
    protocol = "http"
    timeout = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
